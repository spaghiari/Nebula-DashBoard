# CI minimale de Nebula (tests stdlib + compilation) pour Forgejo Actions.
#
# DÉCLENCHEMENT MANUEL PAR DÉFAUT (onglet Actions > tests > Run workflow) :
# tant qu'aucun runner n'est enregistré, un déclenchement automatique
# laisserait des jobs « en attente » à chaque push.
# Une fois un runner disponible (label `docker`), décommenter `push` et
# `pull_request` ci-dessous.
#
# Matrice de deux images (node pour actions/checkout + git pour les tests
# de system_update + python3) :
# - node:20-bookworm (complète) : Python 3.11 de Debian bookworm ;
# - nikolaik/python-nodejs:python3.10-nodejs20 : Python 3.10, le MINIMUM
#   annoncé (une syntaxe ou une API 3.11+ casse ce job).
# Équivalent local : python -m unittest discover -s dashboard/tests
# (3.10 en local : `uv python install 3.10`, puis lancer avec cet interpréteur).

name: tests

on:
  workflow_dispatch:
  # push:
  #   branches: [main, 'feature/**']
  # pull_request:

jobs:
  tests:
    name: tests (Python ${{ matrix.python }})
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            image: node:20-bookworm
          - python: "3.10"
            image: nikolaik/python-nodejs:python3.10-nodejs20
    container:
      image: ${{ matrix.image }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - run: python3 --version && git --version
      # Garde-fou : le job tourne bien sur la version annoncée (image mal taguée).
      - run: python3 -c "import sys; v = '%d.%d' % sys.version_info[:2]; assert v == '${{ matrix.python }}', v"
      - run: python3 -m compileall -q dashboard/server.py dashboard/dashcore dashboard/tests
      - run: python3 -m unittest discover -s dashboard/tests -v
