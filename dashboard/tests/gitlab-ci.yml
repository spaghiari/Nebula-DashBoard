# CI minimale de Nebula (tests stdlib + compilation).
#
# FICHIER DÉDIÉ, INACTIF PAR DÉFAUT. Le `.gitlab-ci.yml` racine n'est pas
# versionné (retiré du suivi, et listé dans USER_DATA_FILES de
# dashboard/dashcore/system_update.py comme config locale) : on ne le
# réintroduit pas, pour ne casser ni l'auto-update des clients ni le choix
# « pas de pipeline tant qu'aucun runner n'est configuré ».
#
# Activation (une fois un runner Docker disponible pour le projet) :
#   GitLab > Settings > CI/CD > General pipelines >
#   « CI/CD configuration file » = dashboard/tests/gitlab-ci.yml
#
# Équivalent local : python -m unittest discover -s dashboard/tests

stages:
  - test

variables:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^feature\//

tests:
  stage: test
  # Image officielle complète (et non -slim) : elle embarque git, requis par
  # les tests de system_update (sinon ils sont ignorés, pas en échec).
  image: python:3.12
  script:
    - python --version
    - git --version
    - python -m compileall -q dashboard/server.py dashboard/dashcore dashboard/tests
    - python -m unittest discover -s dashboard/tests -v
