<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Workspace</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-card: #161b22;
    --bg-hover: #1f2630;
    --bg-input: #0b0f15;
    --border: #30363d;
    --fg: #c9d1d9;
    --fg-dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --orange: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
    --gray: #6e7681;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--fg);
    font-family: var(--mono); font-size: 14px; line-height: 1.55;
  }

  /* ---------- NAV ---------- */
  nav.top {
    position: sticky; top: 0; z-index: 50;
    background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 0 32px;
    display: flex; align-items: center; gap: 4px; height: 50px;
  }
  nav.top .brand {
    color: var(--accent); font-weight: 600; font-size: 15px;
    margin-right: 22px; white-space: nowrap;
  }
  nav.top a {
    color: var(--fg-dim); text-decoration: none;
    padding: 6px 14px; border-radius: 5px; font-size: 13px;
    transition: background .15s, color .15s;
  }
  nav.top a:hover { background: var(--bg-hover); color: var(--fg); }
  nav.top a.active { color: var(--accent); background: rgba(88,166,255,.08); }
  nav.top .spacer { flex: 1; }
  nav.top .env-pill {
    padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border);
    font-size: 11px; color: var(--fg-dim);
  }
  nav.top .env-pill.has { color: var(--green); border-color: rgba(63,185,80,.5); }
  nav.top .clock { color: var(--fg-dim); font-size: 12px; margin-left: 14px; }

  /* ---------- PAGE CONTAINER ---------- */
  main { padding: 24px 32px 60px; max-width: 1500px; margin: 0 auto; }
  h2 {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    font-size: 13px; text-transform: uppercase; letter-spacing: 1.3px;
    color: var(--fg-dim); margin: 22px 0 12px; font-weight: 600;
  }
  h2 .h2-actions { display: flex; gap: 8px; text-transform: none; letter-spacing: 0; }
  h1.page-title {
    margin: 0 0 20px; font-size: 22px; color: var(--accent); font-weight: 600;
    display: flex; align-items: center; gap: 12px;
  }
  h1.page-title .sub { font-size: 13px; color: var(--fg-dim); font-weight: normal; }
  .back-link {
    color: var(--fg-dim); text-decoration: none; font-size: 13px;
    margin-bottom: 10px; display: inline-block;
  }
  .back-link:hover { color: var(--accent); }

  /* ---------- BUTTONS ---------- */
  .btn {
    background: transparent; color: var(--accent);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 6px 12px; font-family: var(--mono); font-size: 12px;
    cursor: pointer; transition: background .15s, border-color .15s;
  }
  .btn:hover { background: rgba(88,166,255,.1); border-color: var(--accent); }
  .btn.danger { color: var(--red); }
  .btn.danger:hover { background: rgba(248,81,73,.1); border-color: var(--red); }
  .btn.primary { background: var(--accent); color: #0d1117; border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.icon { padding: 6px 10px; }
  .btn.xs { padding: 3px 10px; font-size: 11px; }
  .btn.flex { flex: 1; }
  .h2-btn {
    font-family: var(--mono); font-size: 12px;
    color: var(--accent); background: transparent;
    border: 1px solid var(--border); border-radius: 5px;
    padding: 3px 10px; cursor: pointer;
  }
  .h2-btn:hover { border-color: var(--accent); background: rgba(88,166,255,.08); }

  /* ---------- CARDS / GRID ---------- */
  .grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  }
  .card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 16px;
    transition: background .15s, border-color .15s;
  }
  .card:hover { background: var(--bg-hover); border-color: var(--accent); }
  .card.clickable { cursor: pointer; }
  .card .title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .card .desc { color: var(--fg-dim); font-size: 12px; margin-bottom: 8px; min-height: 18px; }
  .card .mcp-badge {
    display: inline-block; font-size: 11px; color: var(--purple);
    background: rgba(188,140,255,.1); padding: 2px 8px; border-radius: 10px;
    margin-bottom: 10px;
  }
  .card .mcp-badge.none { color: var(--gray); background: rgba(110,118,129,.1); }
  .card .actions { display: flex; gap: 6px; margin-top: 8px; }

  /* ---------- LISTE MCP ---------- */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .list-item {
    display: flex; justify-content: space-between; align-items: center; gap: 14px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 14px;
  }
  .list-item .info { flex: 1; min-width: 0; }
  .list-item .info .name { font-weight: 600; }
  .list-item .info .meta { font-size: 11px; color: var(--fg-dim); margin-top: 2px; }
  .list-item .info .notes { font-size: 12px; color: var(--fg-dim); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 500px; }
  .list-item .right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    text-transform: uppercase; letter-spacing: .5px; font-weight: 600;
    white-space: nowrap;
  }
  .badge-green  { background: rgba(63,185,80,.15);  color: var(--green); }
  .badge-blue   { background: rgba(88,166,255,.15); color: var(--accent); }
  .badge-orange { background: rgba(210,153,34,.15); color: var(--orange); }
  .badge-red    { background: rgba(248,81,73,.15);  color: var(--red); }
  .badge-gray   { background: rgba(110,118,129,.2); color: var(--gray); }
  .badge-purple { background: rgba(188,140,255,.15); color: var(--purple); }
  .mini {
    background: transparent; border: 1px solid var(--border);
    color: var(--fg-dim); padding: 3px 8px; border-radius: 4px;
    font-family: var(--mono); font-size: 11px; cursor: pointer;
  }
  .mini:hover { color: var(--accent); border-color: var(--accent); }
  .mini.del:hover { color: var(--red); border-color: var(--red); }
  .mini.test:hover { color: var(--green); border-color: var(--green); }

  /* ---------- TOOLBAR ---------- */
  .toolbar { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
  .toolbar input[type="search"], .toolbar select {
    background: var(--bg-input); color: var(--fg);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 6px 10px; font-family: var(--mono); font-size: 13px;
  }
  .toolbar input[type="search"] { flex: 1; min-width: 200px; }

  /* ---------- FORM ---------- */
  .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .form-row label { font-size: 12px; color: var(--fg-dim); }
  .form-row input, .form-row select, .form-row textarea {
    background: var(--bg-input); color: var(--fg);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 8px 10px; font-family: var(--mono); font-size: 13px;
  }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus {
    outline: none; border-color: var(--accent);
  }
  .form-row textarea { resize: vertical; min-height: 60px; }
  .form-row .hint { font-size: 11px; color: var(--fg-dim); margin-top: 2px; }
  .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  /* ---------- TABS DANS UNE MODALE ---------- */
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
  .tab {
    padding: 6px 14px; cursor: pointer; color: var(--fg-dim);
    border-bottom: 2px solid transparent; font-size: 13px;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .ws-checklist { display: flex; gap: 12px; flex-wrap: wrap; }
  .ws-checklist label {
    display: flex; align-items: center; gap: 6px;
    background: var(--bg-input); padding: 4px 10px; border-radius: 4px;
    border: 1px solid var(--border); cursor: pointer; font-size: 12px;
  }
  .ws-checklist input { margin: 0; }

  /* ---------- TEMPLATES ---------- */
  .template-grid {
    display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  }
  .tpl-card {
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 12px; cursor: pointer;
    transition: border-color .15s, background .15s;
    display: block;
  }
  .tpl-card:hover { border-color: var(--accent); }
  .tpl-card.selected { border-color: var(--accent); background: rgba(88,166,255,.08); }
  .tpl-card input { display: none; }
  .tpl-card .tpl-head { font-size: 13px; margin-bottom: 4px; }
  .tpl-card .tpl-desc { font-size: 11px; color: var(--fg-dim); line-height: 1.3; }

  /* ---------- STATS ---------- */
  .stats-grid {
    display: grid; gap: 8px;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
  .stat-tile {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 14px;
  }
  .stat-tile .title { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .stat-tile .row { font-size: 11px; color: var(--fg-dim); display: flex; justify-content: space-between; }
  .stat-tile .last { font-size: 11px; color: var(--accent); margin-top: 4px; }

  /* ---------- SANITY / JOURNAL / QUICK ---------- */
  .quick-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .quick-btn {
    background: var(--bg-card); color: var(--fg);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 6px 12px; font-family: var(--mono); font-size: 12px; cursor: pointer;
  }
  .quick-btn:hover { border-color: var(--accent); color: var(--accent); }
  .sanity-block { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; margin-top: 12px; }
  .sanity-block.ok { border-color: rgba(63,185,80,.4); }
  .sanity-item { font-size: 12px; margin: 4px 0; }
  .sanity-tag { font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-right: 6px; }
  .sanity-tag.missing { background: rgba(210,153,34,.2); color: var(--orange); }
  .sanity-tag.stale   { background: rgba(248,81,73,.2); color: var(--red); }
  .sanity-tag.env     { background: rgba(188,140,255,.2); color: var(--purple); }
  .journal textarea {
    width: 100%; min-height: 70px;
    background: var(--bg-card); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 10px; font-family: var(--mono); font-size: 13px; resize: vertical;
  }
  .journal .j-actions { margin-top: 8px; display: flex; gap: 8px; }
  .entries { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .entry {
    background: var(--bg-card); border-left: 3px solid var(--accent);
    padding: 8px 12px; font-size: 13px; border-radius: 0 4px 4px 0;
  }
  .entry .ts { color: var(--fg-dim); font-size: 11px; }

  /* ---------- MODALE ---------- */
  #toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--bg-card); border: 1px solid var(--green);
    color: var(--green); padding: 10px 18px; border-radius: 6px;
    opacity: 0; transform: translateY(10px); transition: all .25s;
    pointer-events: none; font-size: 13px; z-index: 100; max-width: 420px;
    white-space: pre-wrap;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.err { border-color: var(--red); color: var(--red); }
  .modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.65); align-items: center; justify-content: center;
    padding: 20px; z-index: 110;
  }
  .modal.show { display: flex; }
  .modal-box {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 8px; max-width: 620px; width: 100%;
    max-height: 88vh; display: flex; flex-direction: column;
  }
  .modal-box.wide { max-width: 860px; }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
  }
  .modal-header h3 { margin: 0; color: var(--accent); font-size: 15px; }
  .modal-header button {
    background: transparent; color: var(--fg-dim); border: none;
    font-size: 22px; cursor: pointer; line-height: 1;
  }
  .modal-body { padding: 16px 18px; overflow: auto; }
  .modal-body pre {
    margin: 0; background: var(--bg); padding: 12px; border-radius: 6px;
    font-size: 12px; white-space: pre-wrap; word-break: break-word;
  }
  .modal-footer {
    padding: 12px 18px; border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 8px;
  }

  /* ---------- WORKSPACE DETAIL ---------- */
  .ws-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .ws-layout { grid-template-columns: 1fr; } }
  .panel {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 18px;
  }
  .panel h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--fg-dim); font-weight: 600; }
  .panel .row-meta { font-size: 12px; color: var(--fg-dim); margin: 4px 0; }
  .panel .row-meta strong { color: var(--fg); }
  .panel .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

  /* ---------- STATUS BAR OFFLINE ---------- */
  .status-bar {
    position: fixed; top: 0; left: 0; right: 0;
    background: var(--red); color: #fff; text-align: center;
    padding: 6px; font-size: 12px; display: none; z-index: 200;
  }
  .status-bar.show { display: block; }

  .kbd {
    display: inline-block; font-size: 10px; padding: 1px 5px;
    border: 1px solid var(--border); border-radius: 3px;
    background: var(--bg); color: var(--fg-dim);
  }
  code.inline { background: var(--bg); padding: 1px 6px; border-radius: 3px; font-size: 12px; }

  table.matrix {
    border-collapse: collapse; width: 100%; font-size: 12px;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden;
  }
  table.matrix th, table.matrix td {
    padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: center;
  }
  table.matrix th { background: var(--bg-hover); font-weight: 600; color: var(--fg-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  table.matrix td:first-child, table.matrix th:first-child { text-align: left; padding-left: 14px; }
  table.matrix td.cell { cursor: pointer; user-select: none; }
  table.matrix td.cell:hover { background: var(--bg-hover); }
  table.matrix .mark { display: inline-block; width: 18px; height: 18px; line-height: 18px; border-radius: 3px; font-size: 13px; font-weight: 600; }
  table.matrix .mark.on  { background: rgba(63,185,80,.25); color: var(--green); border: 1px solid var(--green); }
  table.matrix .mark.off { background: rgba(248,81,73,.15); color: var(--red); border: 1px solid var(--red); }
  table.matrix .mark.inherit { background: var(--bg-input); color: var(--fg-dim); border: 1px dashed var(--border); }
  .empty { color: var(--fg-dim); font-size: 12px; font-style: italic; padding: 14px; text-align: center; }
</style>
</head>
<body>

<div id="offline" class="status-bar">
  Serveur déconnecté — lance <code>C:\claude-workspace\scripts\start-dashboard.bat</code>
</div>

<nav class="top">
  <span class="brand">Claude Workspace</span>
  <a href="#/" data-route="home">Home</a>
  <a href="#/mcps" data-route="mcps">MCPs</a>
  <a href="#/plugins" data-route="plugins">Plugins</a>
  <a href="#/templates" data-route="templates">Templates</a>
  <a href="#/tools" data-route="tools">Outils</a>
  <span class="spacer"></span>
  <input type="search" id="globalSearch" placeholder="/ pour chercher…" style="background: var(--bg-input); color: var(--fg); border: 1px solid var(--border); border-radius: 5px; padding: 4px 10px; font-family: var(--mono); font-size: 12px; width: 200px;">
  <div id="searchResults" style="position: absolute; top: 48px; right: 32px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; display: none; max-width: 400px; z-index: 60;"></div>
  <span id="envPill" class="env-pill">.env.local ?</span>
  <span id="clock" class="clock"></span>
</nav>

<main id="page"></main>

<div id="toast"></div>

<div id="modal" class="modal">
  <div class="modal-box" id="modalBox">
    <div class="modal-header">
      <h3 id="modalTitle"></h3>
      <button id="modalClose">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script>
// ============================================================
// API
// ============================================================
const API = {
  async get(p) {
    const r = await fetch(p);
    if (!r.ok) throw new Error(`GET ${p} → ${r.status}`);
    return r.json();
  },
  async post(p, b) {
    const r = await fetch(p, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(b || {}),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `POST ${p} → ${r.status}`);
    return j;
  },
  async del(p) {
    const r = await fetch(p, { method: 'DELETE' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `DELETE ${p} → ${r.status}`);
    return j;
  },
};

// ============================================================
// State / helpers
// ============================================================
const STATE = {
  workspaces: [],
  mcps: [],
  envKeys: [],
  wsActive: {},
  templates: [],
  plugins: {},
  skillsGlobal: [],
  filter: { q: '', status: '', ws: '' },
};

function toast(msg, isErr = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', isErr);
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 3000);
}
function escapeHtml(s) {
  return (s || '').toString().replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function tick() {
  document.getElementById('clock').textContent = new Date().toLocaleString('fr-FR', {
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
}
setInterval(tick, 1000); tick();

// ============================================================
// Modale générique
// ============================================================
const modal = document.getElementById('modal');
function openModal({ title, body, footer, wide = false }) {
  document.getElementById('modalTitle').textContent = title;
  const b = document.getElementById('modalBody');
  b.innerHTML = ''; b.append(body);
  const f = document.getElementById('modalFooter');
  f.innerHTML = ''; if (footer) f.append(footer);
  document.getElementById('modalBox').classList.toggle('wide', wide);
  modal.classList.add('show');
}
function closeModal() { modal.classList.remove('show'); }
document.getElementById('modalClose').onclick = closeModal;
// Plus de fermeture au clic sur le backdrop (évitait les pertes de saisie).
// Fermer avec : bouton ✕ en haut, bouton Annuler/Fermer, ou touche Esc.
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ============================================================
// Loader global
// ============================================================
async function loadData() {
  // Chaque endpoint est tolérant — une panne individuelle n'empêche pas les autres sections
  const safe = (p, fallback) => API.get(p).catch(err => {
    console.warn(`[dashboard] ${p} :`, err.message);
    return fallback;
  });

  const [ws, mcps, env, tpls, plugins, skills] = await Promise.all([
    safe('/api/workspaces', { workspaces: [] }),
    safe('/api/mcps',       { mcps: [] }),
    safe('/api/env',        { keys: [], exists: false }),
    safe('/api/templates',  { templates: [] }),
    safe('/api/plugins',    { enabled: {}, count: 0 }),
    safe('/api/skills',     { global: [] }),
  ]);

  // Détection serveur hors ligne : si /api/workspaces a échoué ET qu'on a zéro workspace
  // (vs. un serveur up qui renvoie vraiment 0), on regarde le fallback spécifique
  let online = true;
  try { await API.get('/api/workspaces'); }
  catch { online = false; }

  STATE.workspaces = ws.workspaces || [];
  STATE.mcps = mcps.mcps || [];
  STATE.envKeys = env.keys || [];
  STATE.templates = tpls.templates || [];
  STATE.plugins = plugins;
  STATE.skillsGlobal = skills.global || [];

  const pill = document.getElementById('envPill');
  if (env.exists) {
    pill.textContent = `.env.local · ${env.keys.length} clés`;
    pill.classList.add('has');
  } else {
    pill.textContent = '.env.local absent';
    pill.classList.remove('has');
  }

  const results = await Promise.all(STATE.workspaces.map(w =>
    safe(`/api/workspaces/${w.id}/mcps`, { active: [], has_file: false }).then(r => [w.id, r])
  ));
  STATE.wsActive = Object.fromEntries(results);

  document.getElementById('offline').classList.toggle('show', !online);
  return online;
}
async function checkOnline() {
  try { await API.get('/api/workspaces'); document.getElementById('offline').classList.remove('show'); }
  catch { document.getElementById('offline').classList.add('show'); }
}

// ============================================================
// Router (hash-based)
// ============================================================
const page = document.getElementById('page');

function setActiveNav(route) {
  document.querySelectorAll('nav.top a').forEach(a => {
    a.classList.toggle('active', a.dataset.route === route);
  });
}

async function route() {
  const hash = location.hash || '#/';
  await loadData();
  if (hash.startsWith('#/workspace/')) {
    const id = decodeURIComponent(hash.slice('#/workspace/'.length));
    setActiveNav('home');
    return renderWorkspaceDetail(id);
  }
  if (hash === '#/mcps')      { setActiveNav('mcps');      return renderMCPsPage(); }
  if (hash === '#/plugins')   { setActiveNav('plugins');   return renderPluginsPage(); }
  if (hash === '#/templates') { setActiveNav('templates'); return renderTemplatesPage(); }
  if (hash === '#/tools')     { setActiveNav('tools');     return renderToolsPage(); }
  setActiveNav('home');
  renderHomePage();
}
window.addEventListener('hashchange', route);

function renderWorkspacesGrid() {
  const c = document.getElementById('wsGrid');
  c.innerHTML = '';
  if (!STATE.workspaces.length) {
    c.innerHTML = '<div class="card">Aucun workspace.</div>';
    return;
  }
  for (const w of STATE.workspaces) {
    const active = (STATE.wsActive[w.id] || {}).active || [];
    const stat = STATE.wsActive[w.id] || {};
    const card = document.createElement('div');
    card.className = 'card clickable';
    card.innerHTML = `
      <div class="title">${escapeHtml(w.emoji || '📁')} ${escapeHtml(w.label || w.id)}</div>
      <div class="desc">${escapeHtml(w.description || '')}</div>
      <div>${active.length
        ? `<span class="mcp-badge">${active.length} MCP actif${active.length>1?'s':''}</span>`
        : `<span class="mcp-badge none">aucun MCP actif</span>`}</div>
      <div class="actions" onclick="event.stopPropagation()">
        <button class="btn primary flex" data-act="launch">▶ Lancer</button>
        <button class="btn icon" data-act="open" title="Voir détail">↗</button>
        <button class="btn icon" data-act="sync" title="Sync .mcp.json">↻</button>
      </div>
    `;
    card.onclick = () => location.hash = `#/workspace/${w.id}`;
    card.querySelector('[data-act="launch"]').onclick = e => { e.stopPropagation(); launchWorkspace(w.id); };
    card.querySelector('[data-act="open"]').onclick  = e => { e.stopPropagation(); location.hash = `#/workspace/${w.id}`; };
    card.querySelector('[data-act="sync"]').onclick  = e => { e.stopPropagation(); syncWorkspace(w.id); };
    c.appendChild(card);
  }
}

function renderPluginsList() {
  const c = document.getElementById('pluginsList');
  const plugins = STATE.plugins.enabled || {};
  if (!Object.keys(plugins).length) {
    c.innerHTML = '<div class="empty">Aucun plugin activé dans ~/.claude/settings.json</div>';
    return;
  }
  c.innerHTML = '';
  for (const [id, enabled] of Object.entries(plugins)) {
    const row = document.createElement('div');
    row.className = 'list-item';
    row.innerHTML = `
      <div class="info">
        <div class="name">${escapeHtml(id)}</div>
        <div class="meta">Portée : globale · Géré dans ~/.claude/settings.json</div>
      </div>
      <span class="badge ${enabled ? 'badge-green' : 'badge-gray'}">${enabled ? 'actif' : 'désactivé'}</span>
    `;
    c.appendChild(row);
  }
}

async function runSanityInline() {
  const out = document.getElementById('sanityInline');
  try {
    const r = await API.get('/api/sanity-check');
    const findings = r.findings || [];
    const missingEnv = r.missing_env || {};
    const hasIssues = findings.length || Object.keys(missingEnv).length;

    const wrap = document.createElement('div');
    wrap.className = 'sanity-block' + (hasIssues ? '' : ' ok');
    if (!hasIssues) {
      wrap.innerHTML = '<div style="color:var(--green)">✓ Tout est aligné.</div>';
    } else {
      let html = '';
      for (const f of findings) {
        html += `<div class="sanity-item"><strong>${escapeHtml(f.workspace)}</strong> :`;
        for (const id of f.missing_sync) html += ` <span class="sanity-tag missing">sync manquant : ${escapeHtml(id)}</span>`;
        for (const id of f.stale)        html += ` <span class="sanity-tag stale">obsolète : ${escapeHtml(id)}</span>`;
        html += '</div>';
      }
      for (const [id, vars] of Object.entries(missingEnv)) {
        html += `<div class="sanity-item"><strong>${escapeHtml(id)}</strong> : ${vars.map(v => `<span class="sanity-tag env">${escapeHtml(v)}</span>`).join('')}</div>`;
      }
      wrap.innerHTML = html;
    }
    out.innerHTML = '';
    out.appendChild(wrap);
  } catch { out.innerHTML = '<div class="empty">Serveur indisponible</div>'; }
}

// Journal
async function renderEntries() {
  const c = document.getElementById('entries');
  if (!c) return;
  c.innerHTML = '';
  try {
    const r = await API.get('/api/journal');
    const list = (r.entries || []).slice(-10).reverse();
    for (const e of list) {
      const d = document.createElement('div');
      d.className = 'entry';
      const when = e.ts ? new Date(e.ts).toLocaleString('fr-FR') : '';
      d.innerHTML = `<div class="ts">${escapeHtml(when)}</div><div>${escapeHtml(e.text).replace(/\n/g,'<br>')}</div>`;
      c.appendChild(d);
    }
  } catch {}
}
async function addJournalEntry() {
  const ta = document.getElementById('journalInput');
  const text = ta.value.trim();
  if (!text) return;
  try {
    await API.post('/api/journal', { text });
    ta.value = '';
    renderEntries();
  } catch (e) { toast(e.message, true); }
}
async function clearJournal() {
  if (!confirm('Effacer toutes les notes ?')) return;
  try { await API.del('/api/journal'); renderEntries(); toast('Journal effacé'); }
  catch (e) { toast(e.message, true); }
}

          <div class="list" id="wsSkillsGlobal"></div>

  } else {
    for (const s of local) {
      const row = document.createElement('div');
      row.className = 'list-item';
      row.innerHTML = `
        <div class="info">

          <div class="notes">${escapeHtml(s.description || '')}</div>

          <button class="mini del" data-act="del">retirer</button>

  if (!globals.length) {
    globalEl.innerHTML = '<div class="empty">Aucun skill global installé. Crée-en depuis la page Outils.</div>';

      if (resetBtn) resetBtn.onclick = async () => {
        try {
          await API.post(`/api/workspaces/${w.id}/plugins`, { plugin_id: pid, enabled: null });
          toast('Override retiré'); renderWorkspaceDetail(w.id);
        } catch (err) { toast(err.message, true); }
      };
      pluginsEl.appendChild(row);
    }
  }

  document.getElementById('btnLaunch').onclick = () => launchWorkspace(w.id);
  document.getElementById('btnResume').onclick = () => resumeWorkspace(w.id);
  document.getElementById('btnSync').onclick   = () => syncWorkspace(w.id);
  document.getElementById('btnEdit').onclick   = () => editWorkspaceForm(w);
  document.getElementById('btnDel').onclick    = () => confirmDeleteWorkspace(w, false);
  document.getElementById('btnPurge').onclick  = () => confirmDeleteWorkspace(w, true);
  document.getElementById('btnConfig').onclick = () => showWorkspaceConfig(w);
  document.getElementById('btnNewLocalSkill').onclick = () => skillForm(`workspace:${w.id}`);
  document.getElementById('btnMcpCheck').onclick = () => mcpLiveCheck(w.id);
  document.getElementById('btnDuplicate').onclick = () => duplicateWorkspaceForm(w);
  document.getElementById('btnExport').onclick = () => {
    window.location.href = `/api/workspaces/${w.id}/export`;
    toast('Téléchargement du zip…');

  document.getElementById('btnSettings').onclick = () => rawSettingsForm(w.id);

      try { const r = await API.post('/api/open', { target }); toast(r.message || 'Ouvert'); }
      catch (e) { toast(e.message, true); }
    };
  });
}

function skillForm(scope) {
  const scopeLabel = scope === 'global' ? 'global (~/.claude/skills)' : scope.replace('workspace:', 'workspace ');
  const form = document.createElement('div');
  form.innerHTML = `
    <div class="form-row">
      <label>Scope</label>
      <input value="${escapeHtml(scopeLabel)}" readonly>
    </div>
    <div class="form-row">
      <label>Nom (slug) <span style="color:var(--red)">*</span></label>
      <input id="f-name" placeholder="mon-skill">
      <span class="hint">a-z, 0-9, tirets. Utilisé comme nom de dossier et identifiant.</span>
    </div>
    <div class="form-row">
      <label>Description <span style="color:var(--red)">*</span></label>
      <textarea id="f-desc" rows="2" placeholder="Phrase qui décrit à Claude quand utiliser ce skill"></textarea>
      <span class="hint">Claude lit ce champ pour décider si le skill s'applique. Sois précis.</span>
    </div>
    <div class="form-row">
      <label>Corps (Markdown)</label>
      <textarea id="f-body" rows="10" placeholder="# Mon skill&#10;&#10;Instructions détaillées, exemples, conventions…"></textarea>
      <span class="hint">Le contenu sera lu par Claude lorsque le skill est invoqué.</span>
    </div>
  `;
  const footer = document.createElement('div');
  footer.innerHTML = `<button class="btn" id="cancelBtn">Annuler</button><button class="btn primary" id="okBtn">Créer</button>`;
  openModal({ title: 'Nouveau skill', body: form, footer, wide: true });
  footer.querySelector('#cancelBtn').onclick = closeModal;

async function permissionsForm(ws_id) {
  let settings;
  try { settings = JSON.parse((await API.get(`/api/workspaces/${ws_id}/settings`)).content); }
  catch { settings = {}; }
  const perms = settings.permissions || {};
  const allow = (perms.allow || []).join('\n');
  const deny = (perms.deny || []).join('\n');

  const form = document.createElement('div');
  form.innerHTML = `
    <div class="row-meta" style="font-size:12px; color: var(--fg-dim); margin-bottom: 12px;">
      Écrit dans <code class="inline">${escapeHtml(ws_id)}/.claude/settings.json</code> → <code class="inline">permissions</code>.
      Format : une règle par ligne. Exemples : <code class="inline">Bash(npm *)</code> · <code class="inline">Read(**)</code> · <code class="inline">Edit(src/**)</code> · <code class="inline">WebFetch(domain:github.com)</code>
    </div>
    <div class="form-row">
      <label>Allow (claude n'ose pas demander)</label>
      <textarea id="f-allow" style="min-height:120px; font-size: 12px;" placeholder="Bash(npm *)&#10;Bash(git status)&#10;Read(**)">${escapeHtml(allow)}</textarea>
    </div>
    <div class="form-row">
      <label>Deny (refusés systématiquement)</label>
      <textarea id="f-deny" style="min-height:80px; font-size: 12px;" placeholder="Bash(rm -rf *)&#10;Bash(git push --force*)">${escapeHtml(deny)}</textarea>
    </div>
    <div class="form-row">
      <span class="hint">Les règles "allow" suppriment les prompts pour ces commandes. "deny" les bloque. Laisse vide pour revenir au comportement par défaut.</span>
    </div>
  `;
  const footer = document.createElement('div');
  footer.innerHTML = `<button class="btn" id="cancelBtn">Annuler</button><button class="btn primary" id="okBtn">Enregistrer</button>`;
  openModal({ title: `Permissions — ${ws_id}`, body: form, footer, wide: true });
  footer.querySelector('#cancelBtn').onclick = closeModal;
  footer.querySelector('#okBtn').onclick = async () => {
    const value = {};
    const a = form.querySelector('#f-allow').value.split('\n').map(s => s.trim()).filter(Boolean);
    const d = form.querySelector('#f-deny').value.split('\n').map(s => s.trim()).filter(Boolean);
    if (a.length) value.allow = a;
    if (d.length) value.deny = d;
    try {
      await API.post(`/api/workspaces/${ws_id}/settings/permissions`, { value: Object.keys(value).length ? value : null });
      toast('Permissions sauvegardées');
      closeModal();
    } catch (e) { toast(e.message, true); }
  };
}

async function hooksForm(scope, ws_id) {
  let current;
  if (scope === 'global') {
    try { current = (await API.get('/api/hooks/global')).hooks || {}; } catch { current = {}; }
  } else {
    try {
      const settings = JSON.parse((await API.get(`/api/workspaces/${ws_id}/settings`)).content);
      current = settings.hooks || {};
    } catch { current = {}; }
  }

  const form = document.createElement('div');
  form.innerHTML = `
    <div class="row-meta" style="font-size:12px; color: var(--fg-dim); margin-bottom: 12px;">
      Hooks Claude Code — scripts exécutés automatiquement sur des événements.<br>
      Scope : <strong>${escapeHtml(scope === 'global' ? 'global (~/.claude/settings.json)' : scope + ' (.claude/settings.json)')}</strong>
    </div>

    <div class="form-row">
      <label>Presets prêts à l'emploi</label>
      <div class="list">
        ${HOOK_PRESETS.map(p => `
          <div class="list-item">
            <div class="info">
              <div class="name">${escapeHtml(p.label)}</div>
              <div class="meta">${escapeHtml(p.id)}</div>
            </div>
            <button class="mini" data-preset="${escapeHtml(p.id)}">+ ajouter</button>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="form-row" style="margin-top: 16px;">
      <label>Config hooks JSON (brut — édition experte)</label>
      <textarea id="f-json" style="min-height: 260px; font-size: 12px;">${escapeHtml(JSON.stringify(current, null, 2))}</textarea>
      <span class="hint">Objet avec clés : PreToolUse, PostToolUse, UserPromptSubmit, Stop, Notification, SubagentStop, SessionStart.</span>
    </div>
  `;

  form.querySelectorAll('[data-preset]').forEach(btn => {
    btn.onclick = () => {
      const preset = HOOK_PRESETS.find(p => p.id === btn.dataset.preset);
      if (!preset) return;
      const ta = form.querySelector('#f-json');
      let existing;
      try { existing = JSON.parse(ta.value); } catch { existing = {}; }
      for (const [event, arr] of Object.entries(preset.hook)) {
        existing[event] = (existing[event] || []).concat(arr);
      }
      ta.value = JSON.stringify(existing, null, 2);
      toast(`Preset "${preset.label}" ajouté au JSON`);
    };
  });

  const footer = document.createElement('div');
  footer.innerHTML = `
    <button class="btn" id="clearBtn">🗑 Vider</button>
    <button class="btn" id="cancelBtn">Annuler</button>
    <button class="btn primary" id="okBtn">Enregistrer</button>
  `;
  openModal({ title: `Hooks — ${scope}`, body: form, footer, wide: true });
  footer.querySelector('#cancelBtn').onclick = closeModal;
  footer.querySelector('#clearBtn').onclick = () => {
    if (!confirm('Retirer tous les hooks ?')) return;
    form.querySelector('#f-json').value = '{}';
  };
  footer.querySelector('#okBtn').onclick = async () => {
    let hooks;
    try { hooks = JSON.parse(form.querySelector('#f-json').value); }
    catch (e) { return toast('JSON invalide : ' + e.message, true); }
    try {
      if (scope === 'global') {
        await API.post('/api/hooks/global', { hooks });
      } else {
        await API.post(`/api/workspaces/${ws_id}/settings/hooks`, { value: Object.keys(hooks).length ? hooks : null });
      }
      toast('Hooks enregistrés');
      closeModal();
    } catch (e) { toast(e.message, true); }
  };
}

async function fileItemsManager(kind, ws_id) {
  const kindLabel = kind === 'agents' ? 'Subagents' : 'Slash commands';
  const kindSingle = kind === 'agents' ? 'subagent' : 'slash command';
  let data;
  try { data = await API.get(`/api/${kind}/workspace/${ws_id}`); }
  catch { data = { global: [], local: [] }; }

  const body = document.createElement('div');
  const localIds = new Set((data.local || []).map(x => x.id));
  body.innerHTML = `
    <div class="row-meta" style="font-size:12px; color: var(--fg-dim); margin-bottom: 12px;">
      ${kind === 'agents'
        ? 'Un subagent est délégué automatiquement par Claude pour des tâches ciblées. Fichier : <code class="inline">.claude/agents/&lt;nom&gt;.md</code>'
        : 'Un slash command est invoqué manuellement (<code class="inline">/nom</code>). Fichier : <code class="inline">.claude/commands/&lt;nom&gt;.md</code>'}
    </div>

    <h3>Locaux <button class="mini" id="btnNewLocal" style="margin-left: 10px;">+ nouveau</button></h3>
    <div class="list" id="listLocal">
      ${(data.local || []).length ? (data.local || []).map(x => `
        <div class="list-item" data-id="${escapeHtml(x.id)}">
          <div class="info"><div class="name">${escapeHtml(x.name)}</div><div class="notes">${escapeHtml(x.description)}</div></div>
          <div class="right">
            <button class="mini" data-act="open">éditer</button>
            <button class="mini del" data-act="del">supprimer</button>
          </div>
        </div>`).join('') : '<div class="empty">Aucun local</div>'}
    </div>

    <h3 style="margin-top: 14px;">Globaux <button class="mini" id="btnNewGlobal" style="margin-left: 10px;">+ nouveau global</button></h3>
    <div class="list">
      ${(data.global || []).length ? (data.global || []).map(x => `
        <div class="list-item">
          <div class="info"><div class="name">${escapeHtml(x.name)}</div><div class="notes">${escapeHtml(x.description)}</div></div>
          <div class="right">
            ${localIds.has(x.id) ? '<span class="badge badge-gray">déjà local</span>' : ''}
            <button class="mini" data-global-id="${escapeHtml(x.id)}" data-act="open-global">éditer</button>
          </div>
        </div>`).join('') : '<div class="empty">Aucun global</div>'}
    </div>
  `;

  // Events
  body.querySelector('#btnNewLocal').onclick = () => fileItemForm(kind, `workspace:${ws_id}`, null, () => fileItemsManager(kind, ws_id));
  body.querySelector('#btnNewGlobal').onclick = () => fileItemForm(kind, 'global', null, () => fileItemsManager(kind, ws_id));
  body.querySelectorAll('[data-act="open"]').forEach(b => {
    b.onclick = () => {
      const id = b.closest('[data-id]').dataset.id;
      fileItemForm(kind, `workspace:${ws_id}`, id, () => fileItemsManager(kind, ws_id));
    };
  });
  body.querySelectorAll('[data-act="del"]').forEach(b => {
    b.onclick = async () => {
      const id = b.closest('[data-id]').dataset.id;
      if (!confirm(`Supprimer le ${kindSingle} "${id}" ?`)) return;
      try { await API.del(`/api/${kind}/workspace:${ws_id}/${id}`); toast('Supprimé'); fileItemsManager(kind, ws_id); }
      catch (e) { toast(e.message, true); }
    };
  });
  body.querySelectorAll('[data-act="open-global"]').forEach(b => {
    b.onclick = () => fileItemForm(kind, 'global', b.dataset.globalId, () => fileItemsManager(kind, ws_id));
  });

  const footer = document.createElement('div');
  footer.innerHTML = `<button class="btn primary" id="closeBtn">Fermer</button>`;
  openModal({ title: `${kindLabel} — ${ws_id}`, body, footer, wide: true });
  footer.querySelector('#closeBtn').onclick = closeModal;
}

    </div>
  `;
  const footer = document.createElement('div');
  footer.innerHTML = `<button class="btn" id="cancelBtn">Annuler</button><button class="btn primary" id="okBtn">${isEdit ? '💾 Enregistrer' : 'Créer'}</button>`;
  openModal({ title: `${kind === 'agents' ? 'Subagent' : 'Slash command'} ${isEdit ? '— '+existingName : '(nouveau)'}`, body: form, footer, wide: true });
  footer.querySelector('#cancelBtn').onclick = closeModal;
  footer.querySelector('#okBtn').onclick = async () => {
    try {
      if (isEdit) {
        await API.post(`/api/${kind}/${scope}/${existingName}/content`, { content: form.querySelector('#f-body').value });
      } else {
        const payload = {
          scope,
          name: form.querySelector('#f-name').value.trim(),
          description: form.querySelector('#f-desc').value.trim(),
          body: form.querySelector('#f-body').value,

        if (!payload.description) return toast('Description requise', true);
        await API.post(`/api/${kind}`, payload);
      }
      toast('Enregistré');
      closeModal();
      if (onDone) setTimeout(onDone, 100);
    } catch (e) { toast(e.message, true); }
  };

function badgeClass(status) {
  const s = (status || '').toLowerCase();
  if (s.includes('connect')) return 'badge-green';
  if (s.includes('disponible')) return 'badge-blue';
  if (s.includes('configurer')) return 'badge-orange';
  if (s.includes('désactivé') || s.includes('desactive')) return 'badge-red';
  return 'badge-gray';
}

async function renderPluginMatrix(crossList) {
  const wrap = document.getElementById('matrixWrap');
  if (!crossList.length || !STATE.workspaces.length) {
    wrap.innerHTML = '<div class="empty">Aucun plugin ou aucun workspace.</div>';
    return;
  }

  // Récupère les overrides pour chaque workspace en parallèle
  const wsPlugins = {};
  await Promise.all(STATE.workspaces.map(async w => {
    try {
      const r = await API.get(`/api/workspaces/${w.id}/plugins`);
      wsPlugins[w.id] = r.plugins || {};
    } catch { wsPlugins[w.id] = {}; }
  }));

  // Entête
  let html = '<table class="matrix"><thead><tr>';
  html += '<th>Plugin</th><th>Global</th>';
  for (const w of STATE.workspaces) {
    html += `<th title="${escapeHtml(w.label || w.id)}">${escapeHtml(w.emoji || '📁')} ${escapeHtml(w.id)}</th>`;
  }
  html += '</tr></thead><tbody>';

  for (const p of crossList) {
    html += `<tr data-plugin-id="${escapeHtml(p.id)}">`;
    html += `<td><strong>${escapeHtml(p.id)}</strong></td>`;
    // Global
    html += `<td class="cell" data-scope="global" title="Clic pour ${p.enabled ? 'désactiver' : 'activer'} globalement">
      <span class="mark ${p.enabled ? 'on' : 'off'}">${p.enabled ? '✓' : '✕'}</span>
    </td>`;
    // Chaque workspace
    for (const w of STATE.workspaces) {
      const state = (wsPlugins[w.id] || {})[p.id];
      let mark, label, className;
      if (!state || !state.overridden) {
        mark = '–'; label = 'hérite du global'; className = 'inherit';
      } else if (state.effective) {
        mark = '✓'; label = 'override actif'; className = 'on';
      } else {
        mark = '✕'; label = 'override désactivé'; className = 'off';
      }
      html += `<td class="cell" data-scope="workspace" data-ws="${escapeHtml(w.id)}" title="${label} — clic pour cycler">
        <span class="mark ${className}">${mark}</span>
      </td>`;
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  wrap.innerHTML = html;

  // Click handlers
  wrap.querySelectorAll('td.cell').forEach(cell => {
    cell.onclick = async () => {
      const tr = cell.closest('tr');
      const pluginId = tr.dataset.pluginId;
      const scope = cell.dataset.scope;
      if (scope === 'global') {
        // Toggle via CLI
        const plugin = crossList.find(x => x.id === pluginId);
        const route = plugin.enabled ? '/api/plugins/disable' : '/api/plugins/enable';
        toast(`${plugin.enabled ? 'Désactivation' : 'Activation'} globale…`);
        try {
          const r = await API.post(route, { plugin_id: pluginId });
          if (r.ok) toast(`${pluginId} ${plugin.enabled ? 'désactivé' : 'activé'} globalement`);
          else toast(`Échec : ${(r.stderr || r.error || '').slice(0,200)}`, true);
        } catch (e) { toast(e.message, true); }
        renderPluginsPage();
      } else {
        // Cycle : inherit → actif → désactivé → inherit
        const wsId = cell.dataset.ws;
        const current = (wsPlugins[wsId] || {})[pluginId];
        let nextEnabled;
        if (!current || !current.overridden) nextEnabled = true;      // inherit → actif
        else if (current.effective)          nextEnabled = false;     // actif → désactivé
        else                                 nextEnabled = null;      // désactivé → inherit
        try {
          await API.post(`/api/workspaces/${wsId}/plugins`, { plugin_id: pluginId, enabled: nextEnabled });
          toast(`${pluginId} @ ${wsId} : ${nextEnabled === true ? 'actif' : nextEnabled === false ? 'désactivé' : 'hérite du global'}`);
          renderPluginsPage();
        } catch (e) { toast(e.message, true); }
      }
    };
  });
}

async function loadCatalog(marketplaces, enabledMap) {
  const header = document.getElementById('catalogHeader');
  const container = document.getElementById('catalogList');
  if (!marketplaces.length) {
    header.textContent = 'Catalogue';
    container.innerHTML = '<div class="empty">Aucune marketplace enregistrée.</div>';
    return;
  }

  // Charge toutes les marketplaces en parallèle
  const all = [];
  for (const mkt of marketplaces) {
    try {
      const r = await API.get(`/api/plugins/marketplace/${mkt.id}`);
      for (const p of (r.first_party || [])) all.push({ ...p, marketplace: mkt.id, kind: 'plugins', category: 'first' });
      for (const p of (r.external || []))   all.push({ ...p, marketplace: mkt.id, kind: 'external_plugins', category: 'external' });
    } catch (e) { console.warn(e); }
  }

  header.textContent = `Catalogue · ${all.length} plugins disponibles`;
  STATE.catalog = all;
  STATE.catalogEnabled = enabledMap;

  const render = () => {
    const q = document.getElementById('catalogSearch').value.trim().toLowerCase();
    const filter = document.getElementById('catalogFilter').value;

    let items = all;
    if (q) items = items.filter(p =>
      (p.name + ' ' + p.description + ' ' + p.id + ' ' + p.author).toLowerCase().includes(q));
    if (filter === 'first') items = items.filter(p => p.category === 'first');
    if (filter === 'external') items = items.filter(p => p.category === 'external');
    if (filter === 'enabled') {
      items = items.filter(p => {
        const key = `${p.id}@${p.marketplace}`;
        return enabledMap[key] !== undefined;
      });
    }

    container.innerHTML = '';
    if (!items.length) {
      container.innerHTML = '<div class="empty">Aucun résultat</div>';
      return;
    }
    for (const p of items) {
      const key = `${p.id}@${p.marketplace}`;
      const isInstalled = enabledMap[key] !== undefined;
      const card = document.createElement('div');
      card.className = 'card';
      const compBits = [];
      if (p.components.skills)   compBits.push(`${p.components.skills} skill${p.components.skills>1?'s':''}`);
      if (p.components.agents)   compBits.push(`${p.components.agents} agent${p.components.agents>1?'s':''}`);
      if (p.components.commands) compBits.push(`${p.components.commands} command${p.components.commands>1?'s':''}`);

      card.innerHTML = `
        <div class="title">${escapeHtml(p.name)} ${isInstalled ? '<span class="badge badge-green">installé</span>' : ''}</div>
        <div class="desc">${escapeHtml(p.description || '(pas de description)')}</div>
        <div style="font-size: 11px; color: var(--fg-dim); margin-bottom: 10px;">
          ${p.author ? `par <strong>${escapeHtml(p.author)}</strong>` : '<em>auteur inconnu</em>'}
          ${p.category === 'first' ? ' · <span style="color: var(--accent)">first-party</span>' : ' · <span style="color: var(--purple)">external</span>'}
          ${compBits.length ? ' · ' + compBits.join(' · ') : ''}
        </div>
        <div class="actions">
          ${p.has_readme ? '<button class="btn xs flex" data-act="readme">📖 README</button>' : ''}
          ${isInstalled
            ? '<button class="btn xs danger flex" data-act="uninstall">désinstaller</button>'
            : '<button class="btn xs primary flex" data-act="install">+ installer</button>'}
        </div>
      `;
      const readmeBtn = card.querySelector('[data-act="readme"]');
      if (readmeBtn) readmeBtn.onclick = () => showPluginReadme(p);
      const installBtn = card.querySelector('[data-act="install"]');
      if (installBtn) installBtn.onclick = () => installCatalogPlugin(p, marketplaces);
      const uninstallBtn = card.querySelector('[data-act="uninstall"]');
      if (uninstallBtn) uninstallBtn.onclick = () => uninstallPluginConfirm({ id: key });
      container.appendChild(card);
    }
  };

  document.getElementById('catalogSearch').oninput = render;
  document.getElementById('catalogFilter').onchange = render;
  render();
}

async function showPluginReadme(p) {
  let r;
  try { r = await API.get(`/api/plugins/marketplace/${p.marketplace}/${p.kind}/${p.id}/readme`); }
  catch (e) { return toast(e.message, true); }

  const body = document.createElement('div');
  const pre = document.createElement('pre');
  pre.textContent = r.content;
  body.append(pre);

  const footer = document.createElement('div');
  footer.innerHTML = `
    <button class="btn" id="closeBtn">Fermer</button>
    <button class="btn primary" id="installBtn">+ Installer ce plugin</button>
  `;
  openModal({ title: `${p.name} — README`, body, footer, wide: true });
  footer.querySelector('#closeBtn').onclick = closeModal;
  footer.querySelector('#installBtn').onclick = () => {
    closeModal();
    API.get('/api/plugins/installed').then(d => installCatalogPlugin(p, d.marketplaces || []));

async function installCatalogPlugin(p, marketplaces) {
  const spec = `${p.id}@${p.marketplace}`;
  if (!confirm(`Installer "${p.name}" ?\n\nCommande exécutée :\n  claude plugin install ${spec}\n\nÇa peut prendre quelques secondes.`)) return;

  toast(`Installation de ${p.name}…`);
  try {
    const r = await API.post('/api/plugins/install', { spec });
    if (r.ok) {
      toast(`✓ ${p.name} installé\n${(r.stdout || '').slice(0, 300)}`);
      // Rechargement différé pour voir le nouvel état
      setTimeout(() => renderPluginsPage(), 600);
    } else {
      const err = (r.stderr || r.error || 'erreur inconnue').slice(0, 400);
      toast(`Échec : ${err}`, true);
    }
  } catch (e) { toast(e.message, true); }
}

function uninstallPluginConfirm(p) {
  if (!confirm(`Désinstaller "${p.id}" via claude plugin uninstall ?\n\nClaude CLI gère la suppression proprement (marketplace, fichiers, config).`)) return;
  toast('Désinstallation en cours…');
  API.post('/api/plugins/uninstall', { plugin_id: p.id })
    .then(r => {
      if (r.ok) {
        toast(`✓ ${p.id} désinstallé\n${(r.stdout || '').slice(0, 300)}`);
      } else {
        toast(`Échec désinstall : ${(r.stderr || r.error || 'erreur inconnue').slice(0, 300)}`, true);
      }
      renderPluginsPage();
    })
    .catch(e => toast(e.message, true));
}

    const name = form.querySelector('#f-name').value.trim();

      mkt = sel.value === '__custom' ? form.querySelector('#f-mkt-custom').value.trim() : sel.value;
    } else {
      mkt = sel.value.trim();
    }
    if (!name || !mkt) return toast('Nom et marketplace requis', true);

    const spec = `${name}@${mkt}`;
    toast(`Installation de ${spec}…`);
    try {

async function renderEnvEditor() {
  const c = document.getElementById('envList');
  if (!c) return;
  c.innerHTML = '<div class="empty">Chargement…</div>';
  try {
    const r = await API.get('/api/env/values');
    const entries = Object.entries(r.values || {}).sort((a, b) => a[0].localeCompare(b[0]));
    if (!entries.length) {
      c.innerHTML = '<div class="empty">Aucune variable. Clique "+ Nouvelle variable" pour en ajouter.</div>';
      return;
    }

    // Regrouper par préfixe (premier segment avant _)
    const groups = {};
    for (const [key, value] of entries) {
      const prefix = key.includes('_') ? key.split('_')[0] : '—';
      (groups[prefix] = groups[prefix] || []).push([key, value]);
    }

    c.innerHTML = '';

    const tableStyle = 'width:100%; border-collapse:collapse; font-size:13px;';
    const thStyle = 'text-align:left; padding:5px 10px; color:var(--fg-dim); font-weight:600; font-size:11px; text-transform:uppercase; border-bottom:1px solid var(--border);';
    const tdStyle = 'padding:5px 10px; vertical-align:middle;';
    const trHover = 'onmouseover="this.style.background=\'var(--bg-hover)\'" onmouseout="this.style.background=\'\'"';

    for (const [prefix, vars] of Object.entries(groups).sort()) {
      const section = document.createElement('div');
      section.style.cssText = 'margin-bottom:18px;';

      const header = document.createElement('div');
      header.style.cssText = 'font-size:11px; font-weight:700; text-transform:uppercase; color:var(--fg-dim); letter-spacing:.06em; padding:4px 2px 6px; border-bottom:2px solid var(--border); margin-bottom:2px;';
      header.textContent = prefix;
      section.appendChild(header);

      const table = document.createElement('table');
      table.style.cssText = tableStyle;
      table.innerHTML = `<colgroup><col style="width:220px"><col><col style="width:110px"></colgroup>`;

      for (const [key, value] of vars) {
        const tr = document.createElement('tr');
        tr.style.borderBottom = '1px solid var(--border)';
        tr.setAttribute('onmouseover', "this.style.background='var(--bg-hover)'");
        tr.setAttribute('onmouseout', "this.style.background=''");
        tr.innerHTML = `
          <td style="${tdStyle}"><code class="inline" style="font-size:12px;">${escapeHtml(key)}</code></td>
          <td style="${tdStyle}">
            <div style="display:flex; gap:6px; align-items:center;">
              <input type="password" value="${escapeHtml(value)}" data-env-value
                style="flex:1; padding:3px 7px; font-family:monospace; font-size:12px;
                       background:var(--bg); border:1px solid var(--border); border-radius:4px;
                       color:var(--fg); min-width:0; max-width:420px;" readonly>
              <button class="h2-btn" data-toggle title="Afficher/masquer" style="padding:2px 6px;">👁</button>
            </div>
          </td>
          <td style="${tdStyle} text-align:right;">
            <div style="display:flex; gap:4px; justify-content:flex-end;">
              <button class="h2-btn" data-edit style="padding:2px 8px;">✎</button>
              <button class="h2-btn" data-del style="padding:2px 8px;">🗑</button>
            </div>
          </td>
        `;
        const input = tr.querySelector('[data-env-value]');
        tr.querySelector('[data-toggle]').onclick = () => {
          input.type = input.type === 'password' ? 'text' : 'password';
        };
        tr.querySelector('[data-edit]').onclick = () => envEditRow(key, value);
        tr.querySelector('[data-del]').onclick = async () => {
          if (!confirm(`Supprimer "${key}" de .env.local ?`)) return;
          try {
            await API.del('/api/env/' + encodeURIComponent(key));
            toast('Variable supprimée');
            renderEnvEditor();
          } catch (e) { toast(e.message, true); }
        };
        table.appendChild(tr);
      }
      section.appendChild(table);
      c.appendChild(section);
    }
  } catch (e) {
    c.innerHTML = '<div class="empty">Erreur : ' + escapeHtml(e.message) + '</div>';
  }
}

function envEditRow(existingKey, existingValue) {
  const isNew = !existingKey;

  `;
  const footer = document.createElement('div');
  footer.innerHTML = `
    <button class="btn" id="envCancelBtn">Annuler</button>
    <button class="btn primary" id="envSaveBtn">Enregistrer</button>

    const missing = r.missing_env || {};
    let msg = `Sync ${id} : ${applied.length} MCP${applied.length>1?'s':''}`;

    if (sure !== w.id) { if (sure !== null) toast('Annulé (ID incorrect)', true); return; }
    API.del(`/api/workspaces/${w.id}?purge=true`)
      .then(r => { toast(r.note || 'Supprimé'); location.hash = '#/'; })
      .catch(e => toast(e.message, true));
    return;
  }
  if (!confirm(`Retirer "${w.label}" du dashboard ?\n(Le dossier ${w.path} reste sur disque)`)) return;
  API.del(`/api/workspaces/${w.id}`)
    .then(() => { toast('Workspace retiré'); location.hash = '#/'; })
    .catch(e => toast(e.message, true));
}

async function showWorkspaceConfig(w) {
  let data;
  try { data = await API.get(`/api/workspaces/${w.id}/config`); }
  catch (e) { return toast(e.message, true); }

  const files = data.files || {};
  const listing = data.listing || [];

  // Onglets éditables : filename → label
  const EDITABLE = {
    "CLAUDE.md": "CLAUDE.md",
    "notes.md": "notes.md",
    ".claude/settings.json": ".claude/settings.json",
  };

  function makeEditorPanel(filename, content, placeholder) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex; flex-direction:column; gap:8px; height:100%;';
    if (content === null) {
      wrap.innerHTML = `
        <div class="empty" style="margin-bottom:8px;">${escapeHtml(placeholder)}</div>
        <textarea data-editor="${escapeHtml(filename)}" style="flex:1; min-height:320px; font-family:monospace; font-size:12px; padding:10px; background:var(--bg); border:1px solid var(--border); border-radius:6px; color:var(--fg); resize:vertical;" placeholder="Créer le fichier en saisissant son contenu…"></textarea>
        <div style="display:flex; gap:8px; justify-content:flex-end;"><button class="btn primary" data-save="${escapeHtml(filename)}">💾 Créer &amp; Sauvegarder</button></div>
      `;
    } else {
      wrap.innerHTML = `
        <textarea data-editor="${escapeHtml(filename)}" style="flex:1; min-height:320px; font-family:monospace; font-size:12px; padding:10px; background:var(--bg); border:1px solid var(--border); border-radius:6px; color:var(--fg); resize:vertical;">${escapeHtml(content)}</textarea>
        <div style="display:flex; gap:8px; justify-content:flex-end; align-items:center;">
          <span data-saved-hint style="font-size:11px; color:var(--fg-dim); display:none;">✓ Sauvegardé</span>
          <button class="btn primary" data-save="${escapeHtml(filename)}">💾 Sauvegarder</button>
        </div>
      `;
    }
    return wrap;
  }

  const body = document.createElement('div');
  body.innerHTML = `
    <div class="row-meta" style="margin-bottom: 12px;">
      <strong>Chemin</strong> : <code class="inline">${escapeHtml(data.path)}</code>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="claude">CLAUDE.md</div>
      <div class="tab" data-tab="notes">notes.md</div>
      <div class="tab" data-tab="settings">.claude/settings.json</div>
      <div class="tab" data-tab="mcp">.mcp.json <span style="font-size:10px;opacity:.6;">(lecture)</span></div>
      <div class="tab" data-tab="listing">Fichiers (${listing.length})</div>
    </div>

    <div class="tab-panel active" data-panel="claude"></div>
    <div class="tab-panel" data-panel="notes"></div>
    <div class="tab-panel" data-panel="settings"></div>
    <div class="tab-panel" data-panel="mcp">
      ${files[".mcp.json"] !== null ? `<pre>${escapeHtml(files[".mcp.json"])}</pre>` : '<div class="empty">Pas de .mcp.json — lance Sync MCPs pour le générer.</div>'}
    </div>
    <div class="tab-panel" data-panel="listing">
      <div class="list">
        ${listing.map(f => `
          <div class="list-item">
            <div class="info">
              <div class="name">${f.is_dir ? '📁 ' : '📄 '}${escapeHtml(f.name)}</div>
              <div class="meta">${f.is_dir ? 'dossier' : (f.size/1024).toFixed(1) + ' KB'}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  // Injecter les éditeurs dans les panels
  body.querySelector('[data-panel="claude"]').appendChild(
    makeEditorPanel("CLAUDE.md", files["CLAUDE.md"], "CLAUDE.md absent — crée-le ici.")
  );
  body.querySelector('[data-panel="notes"]').appendChild(
    makeEditorPanel("notes.md", files["notes.md"], "notes.md absent — crée-le ici.")
  );
  body.querySelector('[data-panel="settings"]').appendChild(
    makeEditorPanel(".claude/settings.json", files[".claude/settings.json"], "settings.json absent — ce workspace utilise la config globale.")
  );

  // Tabs
  body.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    body.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
    body.querySelectorAll('.tab-panel').forEach(pn => pn.classList.toggle('active', pn.dataset.panel === t.dataset.tab));
  });

  // Sauvegarde
  body.addEventListener('click', async e => {
    const btn = e.target.closest('[data-save]');
    if (!btn) return;
    const filename = btn.dataset.save;
    const ta = body.querySelector(`[data-editor="${filename}"]`);
    if (!ta) return;
    btn.disabled = true;
    try {
      await API.post(`/api/workspaces/${w.id}/file`, { filename, content: ta.value });
      const hint = btn.closest('div').querySelector('[data-saved-hint]');
      if (hint) { hint.style.display = 'inline'; setTimeout(() => hint.style.display = 'none', 2500); }
      else toast('Sauvegardé');
      btn.textContent = '💾 Sauvegarder';
    } catch (err) {
      toast(err.message, true);
    } finally {
      btn.disabled = false;
    }
  });

  // Marquer modifié
  body.addEventListener('input', e => {
    const ta = e.target.closest('[data-editor]');
    if (!ta) return;
    const filename = ta.dataset.editor;
    const btn = body.querySelector(`[data-save="${filename}"]`);
    if (btn) btn.textContent = '💾 Sauvegarder *';
  });

  const footer = document.createElement('div');
  footer.innerHTML = `
    <button class="btn" id="openDir">📂 Ouvrir dossier</button>
    <button class="btn primary" id="closeBtn">Fermer</button>
  `;
  openModal({ title: `Config — ${w.label}`, body, footer, wide: true });
  footer.querySelector('#closeBtn').onclick = closeModal;
  footer.querySelector('#openDir').onclick = async () => {
    try { const r = await API.post('/api/open', { target: `workspace-dir:${w.id}` }); toast(r.message); }
    catch (e) { toast(e.message, true); }
  };
}

// ---- Formulaires workspace & MCP (inchangés fonctionnellement)
async function workspaceForm() {
  let templates = STATE.templates;
  if (!templates.length) { try { templates = (await API.get('/api/templates')).templates; } catch { templates = [{ id: 'blank', label: 'Blank', emoji:'📄', description:'' }]; } }

  const form = document.createElement('div');
  form.innerHTML = `
    <div class="form-row">
      <label>Template</label>
      <div class="template-grid">
        ${templates.map((t, i) => `
          <label class="tpl-card${i===0?' selected':''}">
            <input type="radio" name="tpl" value="${escapeHtml(t.id)}" ${i===0?'checked':''}>
            <div class="tpl-head">${escapeHtml(t.emoji)} <strong>${escapeHtml(t.label)}</strong></div>
            <div class="tpl-desc">${escapeHtml(t.description)}</div>
          </label>
        `).join('')}
      </div>
    </div>
    <div class="form-row">
      <label>ID <span style="color:var(--red)">*</span></label>
      <input id="f-id" placeholder="ex: proxmox">
      <span class="hint">a-z, 0-9, tirets</span>
    </div>
    <div class="form-grid-2">
      <div class="form-row"><label>Label</label><input id="f-label"></div>
      <div class="form-row"><label>Emoji</label><input id="f-emoji" maxlength="4"></div>
    </div>
    <div class="form-row"><label>Description</label><input id="f-desc"></div>
    <div class="form-row"><label>Outils</label><input id="f-tools"></div>
  `;
  form.querySelectorAll('.tpl-card input').forEach(inp => {
    inp.onchange = () => {
      form.querySelectorAll('.tpl-card').forEach(c => c.classList.remove('selected'));
      inp.closest('.tpl-card').classList.add('selected');
      const emojiField = form.querySelector('#f-emoji');
      if (!emojiField.value) {
        const tpl = templates.find(t => t.id === inp.value);
        if (tpl) emojiField.value = tpl.emoji;
      }
    };
  });
  const footer = document.createElement('div');
  footer.innerHTML = `<button class="btn" id="cancelBtn">Annuler</button><button class="btn primary" id="okBtn">Créer</button>`;
  openModal({ title: 'Nouveau workspace', body: form, footer, wide: true });
  footer.querySelector('#cancelBtn').onclick = closeModal;
  footer.querySelector('#okBtn').onclick = async () => {
    const tpl = form.querySelector('input[name="tpl"]:checked')?.value || 'blank';
    const payload = {
      id: form.querySelector('#f-id').value.trim(),
      label: form.querySelector('#f-label').value.trim(),
      emoji: form.querySelector('#f-emoji').value.trim() || '📁',
      description: form.querySelector('#f-desc').value.trim(),
      tools: form.querySelector('#f-tools').value.trim(),
      template: tpl,
    };
    if (!payload.id) return toast('ID requis', true);
    try {
      const r = await API.post('/api/workspaces', payload);
      toast(`Workspace créé (${r.files?.length || 0} fichiers)`);
      closeModal();
      route();
    } catch (e) { toast(e.message, true); }
  };
  setTimeout(() => form.querySelector('#f-id').focus(), 30);
}

function mcpForm(existing = null) {
  const m = existing || {};
  const wsList = STATE.workspaces.map(w => w.id);
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="tabs">
      <div class="tab active" data-tab="form">Formulaire</div>
      <div class="tab" data-tab="raw">JSON brut</div>
    </div>
    <div class="tab-panel active" data-panel="form">
      <div class="form-grid-3">
        <div class="form-row">
          <label>ID *</label>
          <input id="f-id" value="${escapeHtml(m.id || '')}" ${existing ? 'readonly' : ''}>
        </div>
        <div class="form-row">
          <label>Transport</label>
          <select id="f-transport">
            <option value="stdio" ${(m.transport||'stdio')==='stdio'?'selected':''}>stdio</option>
            <option value="http"  ${m.transport==='http'?'selected':''}>http</option>
            <option value="sse"   ${m.transport==='sse'?'selected':''}>sse</option>
          </select>
        </div>
        <div class="form-row">
          <label>Statut</label>
          <select id="f-status">
            <option ${m.status==='connecté'?'selected':''}>connecté</option>
            <option ${m.status==='disponible'?'selected':''}>disponible</option>
            <option ${(!m.status||m.status==='à configurer')?'selected':''}>à configurer</option>
            <option ${m.status==='à tester'?'selected':''}>à tester</option>
            <option ${m.status==='désactivé'?'selected':''}>désactivé</option>
          </select>
        </div>
      </div>
      <div class="form-grid-2">
        <div class="form-row"><label>Nom</label><input id="f-name" value="${escapeHtml(m.name || '')}"></div>
        <div class="form-row"><label>Auteur / source</label><input id="f-author" value="${escapeHtml(m.author || '')}"></div>
      </div>
      <div class="form-row"><label>Description</label><input id="f-desc" value="${escapeHtml(m.description || '')}"></div>
      <div class="form-row" data-if-transport="stdio">
        <label>Commande</label>
        <input id="f-cmd" value="${escapeHtml(m.command || '')}">
      </div>
      <div class="form-row" data-if-transport="stdio">
        <label>Arguments (un par ligne)</label>
        <textarea id="f-args">${escapeHtml((m.args||[]).join('\n'))}</textarea>
      </div>
      <div class="form-row" data-if-transport="http,sse">
        <label>URL</label>
        <input id="f-url" value="${escapeHtml(m.url || '')}">
      </div>
      <div class="form-row">
        <label>Environnement (KEY=val, une par ligne, \${VAR} supportés)</label>
        <textarea id="f-env">${escapeHtml(Object.entries(m.env||{}).map(([k,v])=>`${k}=${v}`).join('\n'))}</textarea>
        <span class="hint">Clés .env.local : ${STATE.envKeys.length ? STATE.envKeys.join(', ') : '(aucune)'}</span>
      </div>
      <div class="form-row">
        <label>Portée</label>
        <div class="ws-checklist">
          <label><input type="checkbox" name="ws" value="*" ${(m.workspaces||[]).includes('*')?'checked':''}> global (*)</label>
          ${wsList.map(id => `<label><input type="checkbox" name="ws" value="${id}" ${(m.workspaces||[]).includes(id)?'checked':''}> ${id}</label>`).join('')}
        </div>
      </div>
      <div class="form-row"><label>Notes</label><textarea id="f-notes" rows="2">${escapeHtml(m.notes || '')}</textarea></div>
    </div>
    <div class="tab-panel" data-panel="raw">
      <div class="form-row">
        <label>JSON complet</label>
        <textarea id="f-raw" style="min-height: 320px; font-size:12px;">${escapeHtml(JSON.stringify(m || {id:'',transport:'stdio',args:[],env:{},workspaces:[]}, null, 2))}</textarea>
      </div>
    </div>
  `;
  wrap.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    wrap.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x===t));
    wrap.querySelectorAll('.tab-panel').forEach(pn => pn.classList.toggle('active', pn.dataset.panel===t.dataset.tab));
  });
  function updateVis() {
    const t = wrap.querySelector('#f-transport').value;
    wrap.querySelectorAll('[data-if-transport]').forEach(el => {
      el.style.display = el.dataset.ifTransport.split(',').includes(t) ? '' : 'none';
    });
  }
  wrap.querySelector('#f-transport').onchange = updateVis; updateVis();

  const footer = document.createElement('div');
  footer.innerHTML = `<button class="btn" id="cancelBtn">Annuler</button><button class="btn primary" id="okBtn">${existing ? 'Enregistrer' : 'Créer'}</button>`;
  openModal({ title: existing ? `MCP — ${m.id}` : 'Nouveau MCP', body: wrap, footer, wide: true });
  footer.querySelector('#cancelBtn').onclick = closeModal;
  footer.querySelector('#okBtn').onclick = async () => {
    const activeTab = wrap.querySelector('.tab.active').dataset.tab;
    let payload;
    if (activeTab === 'raw') {
      try { payload = JSON.parse(wrap.querySelector('#f-raw').value); }
      catch (e) { return toast('JSON invalide : ' + e.message, true); }
    } else {
      const env = {};
      for (const l of wrap.querySelector('#f-env').value.split('\n')) {
        const line = l.trim();
        if (!line) continue;
        const i = line.indexOf('=');
        if (i > 0) env[line.slice(0,i).trim()] = line.slice(i+1).trim();
      }
      const wsChecked = [...wrap.querySelectorAll('input[name="ws"]:checked')].map(x => x.value);
      payload = {
        id: wrap.querySelector('#f-id').value.trim(),
        transport: wrap.querySelector('#f-transport').value,
        name: wrap.querySelector('#f-name').value.trim(),
        description: wrap.querySelector('#f-desc').value.trim(),
        author: wrap.querySelector('#f-author').value.trim(),
        command: wrap.querySelector('#f-cmd')?.value.trim() || '',
        args: (wrap.querySelector('#f-args')?.value || '').split('\n').map(s=>s.trim()).filter(Boolean),
        url: wrap.querySelector('#f-url')?.value.trim() || '',
        env, workspaces: wsChecked,
        status: wrap.querySelector('#f-status').value,
        notes: wrap.querySelector('#f-notes').value.trim(),
      };
    }
    if (!payload.id) return toast('ID requis', true);
    try {
      const r = await API.post('/api/mcps', payload);
      const syncedNote = (r.synced || []).length ? `\nSync auto : ${(r.synced || []).join(', ')}` : '';
      toast((existing ? 'MCP mis à jour' : 'MCP créé') + syncedNote);
      closeModal();
      route();
    } catch (e) { toast(e.message, true); }
  };
}

      if (ko.length) msg += `\nÉchecs : ${ko.map(x=>`${x.id} (${x.error})`).join(', ')}`;
      toast(msg, ko.length > 0);
      closeModal(); route();
    } catch (e) { toast(e.message, true); }
  };
}

const searchInput = document.getElementById('globalSearch');
const searchResults = document.getElementById('searchResults');
let searchTimer = null;
searchInput.oninput = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    const q = searchInput.value.trim();
    if (!q) { searchResults.style.display = 'none'; return; }
    try {
      const r = await API.get(`/api/search?q=${encodeURIComponent(q)}`);
      const items = r.results || [];
      if (!items.length) {
        searchResults.innerHTML = '<div style="padding: 10px 14px; color: var(--fg-dim); font-size: 12px;">Aucun résultat</div>';
      } else {
        searchResults.innerHTML = items.map(it => `
          <a href="${escapeHtml(it.route)}" style="display: block; padding: 8px 14px; color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--border); font-size: 12px;" onmouseover="this.style.background='var(--bg-hover)'" onmouseout="this.style.background=''">
            <span style="color: var(--fg-dim); text-transform: uppercase; font-size: 10px;">${escapeHtml(it.kind)}</span>
            &nbsp;<strong>${escapeHtml(it.label || it.id)}</strong>
            &nbsp;<span style="color: var(--fg-dim);">${escapeHtml(it.id)}</span>
          </a>
        `).join('');
      }
      searchResults.style.display = 'block';
    } catch (e) { console.warn(e); }
  }, 200);
};
document.addEventListener('click', e => {
  if (!searchResults.contains(e.target) && e.target !== searchInput) {
    searchResults.style.display = 'none';
  }
});

// ============================================================
// Raccourcis clavier
// ============================================================
let chordMode = false;
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) {
    if (e.key === 'Escape') document.activeElement.blur();
    return;
  }
  if (modal.classList.contains('show')) return;

  if (chordMode) {
    chordMode = false;
    const k = e.key.toLowerCase();
    if (k === 'h') location.hash = '#/';
    else if (k === 'm') location.hash = '#/mcps';
    else if (k === 't') location.hash = '#/templates';
    else if (k === 'o') location.hash = '#/tools';
    return;
  }
  if (e.key.toLowerCase() === 'g') { chordMode = true; setTimeout(() => chordMode = false, 1200); return; }

  if (e.key === '/') { e.preventDefault(); searchInput.focus(); }
  else if (e.key.toLowerCase() === 'n') workspaceForm();
  else if (e.key.toLowerCase() === 'm') mcpForm(null);
  else if (e.key.toLowerCase() === 's') syncAll();
});
