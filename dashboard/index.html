<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Nebula — Claude Workspace</title>
  <!-- Anti-flash : pose data-theme AVANT le premier rendu depuis le cache
       localStorage. theme.js (applyTheme/THEMES) reste la source de verite :
       il revalide l'id au chargement et corrige l'attribut si besoin. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('nebula-theme');
        if (t && t !== 'nebula' && /^[a-z-]{1,24}$/.test(t)) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/css/editor-matrix.css">
  <link rel="stylesheet" href="/css/sessions.css">
  <link rel="stylesheet" href="/css/redesign.css">
  <link rel="stylesheet" href="/css/shell-mobile.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a class="brand" href="#/" aria-label="Nebula">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v3.5M12 18v3.5M2.5 12H6M18 12h3.5"/></svg>
          </span>
          <span class="brand-name">nebula</span>
          <span class="brand-version" id="brand-version">v…</span>
        </a>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav" aria-label="Navigation principale"></nav>
      <div class="side-group" id="side-group" hidden><span id="side-group-label">Workspaces récents</span><a href="#/" title="Voir tous les workspaces">Tous</a></div>
      <nav class="side-ws" id="side-ws" aria-labelledby="side-group-label"></nav>
      <div class="side-spacer"></div>
      <div class="sidebar-footer">
        <button class="search-trigger" id="open-palette" type="button" aria-label="Ouvrir la recherche">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <span>Recherche</span>
          <kbd>/</kbd>
        </button>
        <div class="theme-switch" id="theme-switch" role="group" aria-label="Style d'interface"></div>
        <div class="sidebar-profile" id="sidebar-profile">
          <span class="sidebar-profile-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v3.5M12 18v3.5M2.5 12H6M18 12h3.5"/></svg>
          </span>
          <span class="sdot st-run live" aria-hidden="true"></span>
          <span class="sidebar-profile-text">
            <span class="sidebar-profile-name">Espace local</span>
            <span class="sidebar-profile-status">
              <span class="mono" id="sidebar-host">127.0.0.1:4777</span>
            </span>
          </span>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <nav class="breadcrumbs" id="breadcrumbs" aria-label="Fil d'Ariane"></nav>
        </div>
        <div class="page-actions" id="page-actions">
          <button class="cmdk" id="topbar-search" type="button" aria-label="Rechercher ou exécuter (Ctrl+K ou /)" aria-keyshortcuts="Control+K /">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <span>Rechercher ou exécuter</span>
            <kbd>Ctrl K</kbd>
          </button>
          <div id="topbar-update-slot"></div>
          <div id="topbar-actions"></div>
        </div>
      </header>

      <main class="content" id="content" tabindex="-1">
        <div class="page-loader">
          <div class="spinner" aria-hidden="true"></div>
          <span>Chargement…</span>
        </div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="palette-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <div id="offline-banner" class="banner banner-error" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
    <span>Serveur hors ligne — relancez <code>start-dashboard.bat</code></span>
  </div>

  <!-- Foundations : ordre de chargement = ordre des dependances.
       state.js et api.js sont independants. theme.js depend de api.js
       (applyTheme appelle API.post sur save=true). icons.js et utils.js
       n'ont aucune dependance. -->
  <script src="/js/icons.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/state.js"></script>
  <script src="/js/lint.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/modal.js"></script>
  <script src="/js/json-editor.js"></script>
  <script src="/js/nav.js"></script>
  <!-- Pages : forward-refs vers modal*/render* encore dans app.js
       sont resolus au runtime (post-load, hashchange uniquement). -->
  <script src="/js/pages/home.js"></script>
  <script src="/js/pages/mcps.js"></script>
  <script src="/js/pages/mcps-matrix.js"></script>
  <script src="/js/pages/tools.js"></script>
  <script src="/js/pages/templates.js"></script>
  <script src="/js/pages/skills.js"></script>
  <script src="/js/pages/plugins.js"></script>
  <script src="/js/pages/help.js"></script>
  <script src="/js/pages/improvement.js"></script>
  <script src="/app.js"></script>
  <!-- router.js charge APRES app.js : la fonction route() reference les
       renderXxx() encore definis dans app.js. Les hashchange listener
       et les premiers appels route() depuis init() sont post-load. -->
  <script src="/js/router.js"></script>
</body>
</html>
