# Pas de pipeline CI pour ce repo.
# Aucun runner configuré, aucun besoin de tests/build/SAST automatiques.
# Cette règle empêche tout pipeline de se créer (push, MR, schedule).
#
# /!\ NE PAS SUPPRIMER ce fichier — sa suppression réactive Auto DevOps
# de GitLab qui relance des pipelines automatiquement à chaque push.

workflow:
  rules:
    - when: never
